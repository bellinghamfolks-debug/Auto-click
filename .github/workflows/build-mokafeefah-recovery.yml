name: Build Mokafeefah Reconstructed 1.13

on:
  push:
    branches:
      - agent/mokafeefah-reconstructed-v113b
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild recovered source archive
        run: |
          cat recovery-src/part*.b64 | base64 -d > mokafeefah-base.zip
          unzip -t mokafeefah-base.zip

      - name: Unpack recovered source
        run: unzip -q mokafeefah-base.zip -d src

      - name: Apply latest-APK reconstruction
        run: |
          cd src/mokafeefah
          patch -p1 < ../../recovery-overrides/service.patch
          cp ../../recovery-overrides/MainActivity.java app/src/main/java/com/mokafeefah/clicker/MainActivity.java
          cp ../../recovery-overrides/activity_main.xml app/src/main/res/layout/activity_main.xml
          sed -i "s/versionCode 32/versionCode 33/" app/build.gradle
          sed -i "s/versionName '1.12.14'/versionName '1.13.0-recovery'/" app/build.gradle
          grep -n "STATE_POST_REFRESH_CATCHUP\|handlePostRefreshCatchup\|captureDiagnosticNow" app/src/main/java/com/mokafeefah/clicker/ClickerService.java
          grep -n "versionCode\|versionName" app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Build debug APK
        working-directory: src/mokafeefah
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mokafeefah-v1.13.0-reconstructed-debug
          path: src/mokafeefah/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
