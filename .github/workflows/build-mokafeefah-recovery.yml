name: Build Mokafeefah Recovery

on:
  push:
    branches:
      - agent/mokafeefah-recovery-build
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild source archive
        run: |
          cat recovery-src/part*.b64 | base64 -d > mokafeefah-v1.12.15-source.zip
          unzip -t mokafeefah-v1.12.15-source.zip

      - name: Unpack source
        run: unzip -q mokafeefah-v1.12.15-source.zip -d src

      - name: Apply compiler fix
        run: |
          FILE="src/mokafeefah/app/src/main/java/com/mokafeefah/clicker/ClickerService.java"
          if ! grep -q 'import android.os.SystemClock;' "$FILE"; then
            sed -i '/import android.os.Looper;/a import android.os.SystemClock;' "$FILE"
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Build debug APK
        working-directory: src/mokafeefah
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mokafeefah-v1.12.15-debug
          path: src/mokafeefah/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
