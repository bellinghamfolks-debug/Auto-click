name: Build Mokafeefah Engine 1.25 Event Cache

on:
  push:
    branches:
      - agent/mokafeefah-v125-event-cache-engine
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild recovered source archive
        run: |
          cat recovery-src/part*.b64 | base64 -d > mokafeefah-base.zip
          unzip -t mokafeefah-base.zip

      - name: Unpack recovered source
        run: unzip -q mokafeefah-base.zip -d src

      - name: Reconstruct 1.13.1 base
        run: |
          cd src/mokafeefah
          patch -p1 --fuzz=0 < ../../recovery-overrides/service-v113.patch
          cp ../../recovery-overrides/MainActivity-v113.java app/src/main/java/com/mokafeefah/clicker/MainActivity.java
          cp ../../recovery-overrides/activity-main-v113.xml app/src/main/res/layout/activity_main.xml
          if ! grep -q "import android.os.SystemClock;" app/src/main/java/com/mokafeefah/clicker/ClickerService.java; then
            sed -i '/import android.os.Looper;/a import android.os.SystemClock;' app/src/main/java/com/mokafeefah/clicker/ClickerService.java
          fi
          sed -i "s/versionCode 32/versionCode 33/" app/build.gradle
          sed -i -E "s/versionName '[^']+'/versionName '1.13.0-recovery'/" app/build.gradle
          cd ../..
          sed '/^diff -ruN v113_orig\/app\/src\/main\/java\/com\/mokafeefah\/clicker\/MainActivity.java/,$d' recovery-overrides/v1131.patch > /tmp/v1131-engine.patch
          cd src/mokafeefah
          patch -p1 --fuzz=0 < /tmp/v1131-engine.patch
          sed -i "s/versionCode 33/versionCode 34/" app/build.gradle
          sed -i -E "s/versionName '[^']+'/versionName '1.13.1-recovery'/" app/build.gradle

      - name: Apply 1.14 engine base
        run: |
          base64 -d recovery-overrides/v114-engine.patch.gz.b64 | gzip -d > /tmp/v114.patch
          cd src/mokafeefah
          patch -p0 --fuzz=0 < /tmp/v114.patch
          patch -p0 --fuzz=0 < ../../recovery-overrides/v114-rewind.patch

      - name: Apply 1.15 visible snapshot engine
        run: |
          base64 -d recovery-overrides/v115-visible-snapshot.patch.gz.b64 | gzip -d > /tmp/v115.patch
          cd src/mokafeefah
          patch -p1 --fuzz=0 < /tmp/v115.patch

      - name: Apply 1.16 engine-thread architecture
        run: |
          cd src/mokafeefah
          patch -p1 --fuzz=0 < ../../recovery-overrides/v116-engine.patch

      - name: Apply 1.17 verified-scroll invariant
        run: |
          cd src/mokafeefah
          patch -p4 --fuzz=0 < ../../recovery-overrides/v117-verified-scroll.patch

      - name: Apply 1.18 content-bounded gesture
        run: |
          cd src/mokafeefah
          patch -p4 --fuzz=0 < ../../recovery-overrides/v118-content-gesture.patch

      - name: Apply 1.19 gesture-only scroll
        run: |
          cd src/mokafeefah
          patch -p4 --fuzz=0 < ../../recovery-overrides/v119-gesture-only-scroll.patch

      - name: Apply 1.20 no-auto-refresh stability
        run: |
          cd src/mokafeefah
          patch -p1 --fuzz=0 < ../../recovery-overrides/v120-no-auto-refresh.patch
          cp app/src/main/java/com/mokafeefah/clicker/ClickerService.java /tmp/v120-service.java
          if grep -q "triggering soft refresh after" app/src/main/java/com/mokafeefah/clicker/ClickerService.java; then exit 1; fi

      - name: Apply 1.23 performance core
        run: |
          base64 -d recovery-overrides/v123-v120-core-performance.patch.gz.b64 | gzip -d > /tmp/v123.patch
          cd src/mokafeefah
          patch -p4 --fuzz=0 < /tmp/v123.patch
          if grep -q "CACHE-HYGIENE: avgTickMs=" app/src/main/java/com/mokafeefah/clicker/ClickerService.java; then exit 1; fi

      - name: Apply 1.24 popup stall guard
        run: |
          cd src/mokafeefah
          patch -p4 --fuzz=0 < ../../recovery-overrides/v124-popup-stall-guard.patch
          grep -q "STALL-POPUP-RECOVERY:" app/src/main/java/com/mokafeefah/clicker/ClickerService.java

      - name: Apply 1.25 event cache engine
        run: |
          base64 -d recovery-overrides/v125-event-cache-engine.patch.gz.b64 | gzip -d > /tmp/v125.patch
          cd src/mokafeefah
          patch -p1 --fuzz=0 < /tmp/v125.patch
          grep -n "versionCode\|versionName" app/build.gradle
          grep -n "EVENT-WAKE\|viewportCache\|rootMs=\|FLAG_PREFETCH_SIBLINGS" app/src/main/java/com/mokafeefah/clicker/ClickerService.java | head -120
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          base = Path('/tmp/v120-service.java').read_text()
          new = Path('app/src/main/java/com/mokafeefah/clicker/ClickerService.java').read_text()
          xml = Path('app/src/main/res/xml/accessibility_service_config.xml').read_text()
          gradle = Path('app/build.gradle').read_text()
          def method(src, name):
              marker = '    private long ' + name + '('
              st = src.index(marker)
              en = src.find('\n    private ', st + len(marker))
              return src[st:en]
          for name in ('handleAfterLike', 'handleAfterYes'):
              a, b = method(base, name), method(new, name)
              print(name, hashlib.sha256(a.encode()).hexdigest(), hashlib.sha256(b.encode()).hexdigest())
              if a != b:
                  raise SystemExit(name + ' changed from exact 1.20 core')
          for literal in ('MAX_WAIT_AFTER_LIKE_MS = 8000L', 'MAX_WAIT_AFTER_YES_MS  = 8000L'):
              if literal not in new:
                  raise SystemExit('1.20 confirmation timeout changed: ' + literal)
          required = (
              'FLAG_PREFETCH_SIBLINGS', 'activeRootNoPrefetch', 'childAtBoundedPrefetch',
              'scheduleEngineTick', 'viewportLikeNodeCache', '.refresh()', 'rootMs=',
              'EVENT_WAKE_DELAY_MS = 35L', 'EVENT_FALLBACK_MIN_MS = 650L',
              'STALL-POPUP-RECOVERY:'
          )
          for literal in required:
              if literal not in new:
                  raise SystemExit('missing v1.25 engine marker: ' + literal)
          if 'versionCode 46' not in gradle or "versionName '1.25.0-event-cache-engine'" not in gradle:
              raise SystemExit('v1.25 version metadata missing')
          if 'typeViewScrolled' not in xml or 'android:notificationTimeout="60"' not in xml:
              raise SystemExit('event-driven accessibility XML not configured')
          if 'CACHE-HYGIENE: avgTickMs=' in new:
              raise SystemExit('legacy cache hygiene returned')
          if new.count('{') != new.count('}'):
              raise SystemExit('unbalanced braces')
          print('V1.25 ARCHITECTURE CHECKS: PASS')
          print('CONFIRMATION CORE: exact 1.20 method bodies preserved')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Build debug and unsigned release APKs
        working-directory: src/mokafeefah
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: mokafeefah-v1.25.0-event-cache-engine-apks
          path: |
            src/mokafeefah/app/build/outputs/apk/debug/app-debug.apk
            src/mokafeefah/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
