name: Build Mokafeefah Recovery 1.13.1

on:
  push:
    branches:
      - agent/mokafeefah-v1131-fix
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild recovered source archive
        run: |
          cat recovery-src/part*.b64 | base64 -d > mokafeefah-base.zip
          unzip -t mokafeefah-base.zip

      - name: Unpack recovered source
        run: unzip -q mokafeefah-base.zip -d src

      - name: Apply reconstructed engine and UI
        run: |
          cd src/mokafeefah
          patch -p1 --fuzz=0 < ../../recovery-overrides/service-v113.patch
          cp ../../recovery-overrides/MainActivity-v113.java app/src/main/java/com/mokafeefah/clicker/MainActivity.java
          cp ../../recovery-overrides/activity-main-v113.xml app/src/main/res/layout/activity_main.xml
          if ! grep -q "import android.os.SystemClock;" app/src/main/java/com/mokafeefah/clicker/ClickerService.java; then
            sed -i '/import android.os.Looper;/a import android.os.SystemClock;' app/src/main/java/com/mokafeefah/clicker/ClickerService.java
          fi
          sed -i "s/versionCode 32/versionCode 33/" app/build.gradle
          sed -i -E "s/versionName '[^']+'/versionName '1.13.0-recovery'/" app/build.gradle

      - name: Apply 1.13.1 stall and target safety fix
        run: |
          cd src/mokafeefah
          patch -p1 --fuzz=0 < ../../recovery-overrides/v1131.patch
          grep -n "sessionTargetPackage\|OFF_TARGET\|NO_PROGRESS_SCROLL_LIMIT\|STALL:" app/src/main/java/com/mokafeefah/clicker/ClickerService.java | head -30
          grep -n "btnStop\|stopAutomation" app/src/main/java/com/mokafeefah/clicker/MainActivity.java app/src/main/res/layout/activity_main.xml
          grep -n "versionCode\|versionName" app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Build debug APK
        working-directory: src/mokafeefah
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mokafeefah-v1.13.1-recovery-debug
          path: src/mokafeefah/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
