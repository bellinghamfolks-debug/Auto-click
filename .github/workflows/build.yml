name: Build Mokafeefah Clicker APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        working-directory: ./android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        working-directory: ./android
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/mokafeefah-clicker-v2.0-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mokafeefah-clicker-v2.0-apk
          path: android/out/mokafeefah-clicker-v2.0-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release (on manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0-build-${{ github.run_number }}
          name: "مكفوف بوت 2.0 - إصدار ${{ github.run_number }}"
          body: |
            ## مكفوف بوت 2.0 — محرك ذكي مستند للأحداث
            هذا الإصدار يحل مشكلة البطء التراكمي بالكامل.

            ### التحديثات الهندسية
            - 🧠 **Smart Scan & Recycle** — استدعاء recycle() لكل عقدة وتنظيف ذاكرة العناصر
            - ⚡ **Event-Driven Automation** — استجابة فورية لأحداث الشاشة (TYPE_WINDOW_STATE_CHANGED)
            - 🎯 **Filtering Logic** — تجاوز فوري لرسائل "مضاف سابقاً" و "لا يمكن الإضافة"
            - 📜 **Dynamic Scrolling** — ACTION_SCROLL_FORWARD مع مسافة سحب متكيّفة
            - 🛡️ **Watchdog Timer** — استرداد تلقائي بعد 15 ثانية تجمد

            ### إعدادات جديدة
            - حقل كلمات رسائل الخطأ
            - مهلة مراقب الاستعادة (Watchdog)
            - حد التوقف عند العدد المحدد
            - مفاتيح: الوضع السريع، المحرك المستند للأحداث، تفعيل الاهتزاز
          files: android/out/mokafeefah-clicker-v2.0-debug.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
